[workspace]
resolver = "2"
members = ["syn-core", "syn-audio", "syn-tui", "syn-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The model's tests run whole simulations (golden takes, Gray–Scott presets);
# unoptimized, they would dominate `scripts/check.sh`.
[profile.dev.package.syn-core]
opt-level = 1
