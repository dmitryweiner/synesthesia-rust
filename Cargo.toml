[workspace]
resolver = "2"
members = ["syn-audio", "syn-tui", "syn-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
# The model is synesthesia-core's, pinned by revision like the web and Android
# apps (PLAN.md decision 11). Bump `rev` on purpose and run scripts/check.sh.
# syn-player is the render side and syn-session the control logic every app
# shares (decision 12); all three come from the same revision.
syn-core = { git = "https://github.com/dmitryweiner/synesthesia-core", rev = "a0d2cc047176a6f94806946b46a74509ac90d181" }
syn-player = { git = "https://github.com/dmitryweiner/synesthesia-core", rev = "a0d2cc047176a6f94806946b46a74509ac90d181" }
syn-session = { git = "https://github.com/dmitryweiner/synesthesia-core", rev = "a0d2cc047176a6f94806946b46a74509ac90d181" }


[workspace.lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# The model runs whole simulations in this crate's tests and the debug binary;
# unoptimized it would dominate `scripts/check.sh`.
[profile.dev.package.syn-core]
opt-level = 1
[profile.dev.package.syn-session]
opt-level = 1
